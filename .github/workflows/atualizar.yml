name: Atualizar placares

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  repository_dispatch:       # gatilho externo pontual (cron-job.org), ver LEIA-ME
    types: [atualizar]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false   # se dois gatilhos chegarem juntos, um espera o outro

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Recuperar dados anteriores
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      # Valorant: sobe o vlrggapi (API aberta que lê o VLR.gg) só durante a execução
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/atualizar.yml

      - name: Iniciar vlrggapi (estatísticas do Valorant)
        continue-on-error: true
        run: |
          git clone --quiet https://github.com/axsddlr/vlrggapi.git /tmp/vlrggapi
          cd /tmp/vlrggapi && git checkout --quiet 87ebf923c5e55bd2937f06f8192e8b56a6bdfc5d || true
          pip install --quiet httpx==0.28.1 cachetools==7.2.8 uvicorn==0.54.0 fastapi==0.162.4 selectolax==1.0.2
          nohup python main.py > /tmp/vlr.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3001/version && break; sleep 1; done
          echo "VLR_BASE=http://127.0.0.1:3001" >> "$GITHUB_ENV"

      - name: Buscar dados (ESPN + reserva + PandaScore + VLR)
        env:
          PANDASCORE_TOKEN: ${{ secrets.PANDASCORE_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/fetch-data.mjs public/data

      - name: Guardar dados
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: dados-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
